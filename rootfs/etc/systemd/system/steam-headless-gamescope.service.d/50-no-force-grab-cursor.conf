[Service]
# Drop gamescope's --force-grab-cursor (permanent relative-mouse mode: double
# cursor in the centre, clicks delivered to the centre).
#
# Only ExecStart is overridden so every other directive still comes from the
# upstream unit; the wrapper reuses the stock launcher and removes that one flag.
ExecStart=
ExecStart=/usr/local/bin/gamescope-no-force-grab
