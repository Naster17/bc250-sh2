sunshine_name = steam-headless
upnp = disabled
capture = kwin
# GFX1013 exposes no working VAAPI encoder: pin software and skip the ~1s
# vaapi/nvenc/vulkan probe that otherwise runs on every session start.
encoder = software
gamepad = x360
adapter_name = /dev/dri/renderD128
system_tray = disabled
origin_web_ui_allowed = pc
credentials_file = sunshine_state.json
file_state = sunshine_state.json
# Moonlight's requested resolution/refresh drive KWin and gamescope through the
# root display daemon. Managed on every boot by 30-manage-sunshine-display-prep.sh.
global_prep_cmd = [{"do": "/usr/local/bin/steam-display-request", "undo": ""}]
