name: steam-headless

services:
  desktop:
    build:
      context: .
      dockerfile: Dockerfile
    image: steam-headless-bc250:2
    container_name: steam-headless
    hostname: steam-headless
    restart: unless-stopped
    network_mode: host

    cap_add:
      - DAC_READ_SEARCH
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_NICE
      - SYS_PTRACE

    security_opt:
      - apparmor:unconfined
      - seccomp=unconfined
      - systempaths=unconfined
      - writable-cgroups=true
    cgroup: private

    stop_signal: SIGRTMIN+3
    stop_grace_period: 30s
    pids_limit: 8192
    shm_size: 2gb
    tty: true

    environment:
      PUID: '${PUID:-1000}'
      PGID: '${PGID:-1000}'
      TZ: '${TZ:-UTC}'
      COMPOSITOR_RENDER_DEVICE: '/dev/dri/renderD128'
      ENCODER_RENDER_DEVICE: '/dev/dri/renderD128'
      # Boot straight into gamescope + Steam gamepad UI (SteamOS-like).
      # Runtime switch: docker exec steam-headless steam-headless-session-mode desktop
      STEAM_HEADLESS_SESSION_MODE: 'gaming'
      # No VAAPI on GFX1013 -> SHUI must be told explicitly.
      SHUI_ENCODER: 'software'
      # We own ~/.config/sunshine via the baked defaults (see Dockerfile);
      # auto-config would pin "encoder = vaapi" and re-add the display-mode prep.
      SUNSHINE_ENABLE_AUTO_CONFIG: 'false'
      SUNSHINE_ENABLE_AUTO_DISPLAY_MODE: 'false'

    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
      - /dev/fuse:/dev/fuse
      - /dev/uinput:/dev/uinput
      - /dev/uhid:/dev/uhid

    device_cgroup_rules:
      - 'c 13:* rwm'

    tmpfs:
      - /run
      - /run/lock
      - /tmp
      - /dev/input:rw,dev,mode=0755

    volumes:
      - /etc/localtime:/run/host-localtime:ro
      # NOTE: no /sys/devices/virtual/input bind mount. That tree only exists once
      # a virtual input device is registered, so on a cold boot Docker tried to
      # mkdir it inside sysfs and failed ("operation not permitted"), leaving the
      # container unstartable. The container registers its own uinput devices and
      # sees them through the regular /sys mount and its private /dev/input tmpfs.
      - ${SH2_DIR:-/opt/steam-headless}/state:/var/lib/steam-headless
      - ${SH2_DIR:-/opt/steam-headless}/journal:/var/log/journal
      - ${SH2_DIR:-/opt/steam-headless}/data/home:/home/steamheadless
      - ${SH2_DIR:-/opt/steam-headless}/games:/mnt/games
      # The BC-250 amdgpu driver answers gpu_busy_percent with EOPNOTSUPP, which
      # is what makes Steam's performance overlay report nonsense (655%). Steam
      # reads this exact path, so shadow it with a file that
      # /usr/local/bin/steam-gpu-load keeps updated from the fdinfo counters
      # (the same source amdgpu_top uses). The directory is owned by the host
      # user and must exist, with a 3-byte gpu_busy_percent file inside, before
      # the container starts.
      - ${SH2_DIR:-/opt/steam-headless}/metrics:/run/gpu-metrics
      - ${SH2_DIR:-/opt/steam-headless}/metrics/gpu_busy_percent:/sys/class/drm/card0/device/gpu_busy_percent:ro
      # MangoHud (the overlay in gaming mode) also reads the binary gpu_metrics
      # table and prefers its `average_gfx_activity` over gpu_busy_percent. On
      # this APU that field is 0xFFFF, which MangoHud divides by 100 and renders
      # as 655%. Shadow the table as well; steam-gpu-load rewrites it every
      # cycle with the measured activity.
      # Live, unshadowed view of the device directory. It must not sit under a
      # path that anything else patches: the driver files are the source of the
      # values republished below, so a stale copy here freezes every metric.
      # The BC-250 8-core unlock corrupts the clock reporting, so the userspace
      # SMU governor republishes the real value through bind overlays on the
      # host's sysfs. A plain bind of the device directory is a snapshot: it
      # does not follow overlays the governor re-creates when it restarts (every
      # power plan change). Reading through the host's PID 1 root follows the
      # host's live mount tree instead.
      - /proc:/host-proc:ro
      - /sys/class/drm/card0/device:/run/gpu-live:ro
      - ${SH2_DIR:-/opt/steam-headless}/metrics/gpu_metrics:/sys/class/drm/card0/device/gpu_metrics:ro
